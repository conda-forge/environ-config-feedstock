{% set name = "environ-config" %}
{% set version = "26.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 7fe80885d22dd50218664c1e4e2c098429129387ddbb6e51318a3883639ae8b4

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - attrs >=17.4.0
    - python >={{ python_min }}

test:
  imports:
    - environ
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hynek/environ_config
  summary: Boilerplate-free configuration with env variables.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - asford
